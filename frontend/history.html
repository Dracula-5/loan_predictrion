<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prediction History — LoanPredict AI</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
  <div class="container">
    <a class="navbar-brand fw-600 d-flex align-items-center gap-2" href="index.html">
      <i class="bi bi-bank2"></i> LoanPredict AI
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto gap-lg-1">
        <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-calculator me-1"></i>Predict</a></li>
        <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-bar-chart-line me-1"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link active" href="history.html"><i class="bi bi-clock-history me-1"></i>History</a></li>
        <li class="nav-item"><a class="nav-link" href="batch.html"><i class="bi bi-file-earmark-spreadsheet me-1"></i>Batch</a></li>
      </ul>
    </div>
  </div>
</nav>

<main class="main-content">
  <div class="container py-4">
    <div id="loadingState" class="text-center py-5">
      <div class="spinner-border text-primary" style="width:3rem;height:3rem;"></div>
    </div>

    <div id="mainContent" class="d-none">
      <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div>
          <h4 class="fw-700 mb-0">Prediction History</h4>
          <p class="text-muted mb-0 small" id="recordCount"></p>
        </div>
        <div class="d-flex gap-2" id="controls"></div>
      </div>

      <div id="emptyState" class="text-center py-5 d-none">
        <i class="bi bi-inbox fs-1 text-muted d-block mb-3"></i>
        <h5 class="text-muted">No predictions yet</h5>
        <a href="index.html" class="btn btn-primary mt-2"><i class="bi bi-calculator me-2"></i>Make a Prediction</a>
      </div>

      <div class="card shadow-sm" id="tableCard" style="display:none">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0" id="histTable">
              <thead class="table-light">
                <tr>
                  <th>ID</th><th>Date &amp; Time</th><th>Gender</th>
                  <th>Income (₹)</th><th>Loan (₹K)</th><th class="text-center">Credit</th>
                  <th class="text-center">Decision</th><th class="text-center">Prob</th>
                  <th class="text-center">Risk</th><th class="text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="histBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer mt-auto">
  <div class="container text-center">
    <small class="text-muted">LoanPredict AI &mdash; <span id="yr"></span></small>
  </div>
</footer>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script>
document.getElementById("yr").textContent = new Date().getFullYear();

function showToast(msg, err = false) {
  const c = document.getElementById("toast-container");
  const d = document.createElement("div");
  d.className = "toast-msg" + (err ? " toast-error" : "");
  d.textContent = msg;
  c.appendChild(d);
  setTimeout(() => d.remove(), 3500);
}

let allRecords = [];

function renderTable(records) {
  const tbody = document.getElementById("histBody");
  tbody.innerHTML = records.map(r => {
    const inp = r.input || {};
    const probPct = (r.approval_probability * 100).toFixed(1);
    const creditIcon = inp.credit_history == 1 || inp.credit_history === "1"
      ? `<i class="bi bi-check-circle-fill text-success"></i>`
      : `<i class="bi bi-x-circle-fill text-danger"></i>`;
    const badgeClass = r.result === "Approved" ? "bg-success" : "bg-danger";
    const riskClass = r.risk_score < 35 ? "text-success" : r.risk_score < 65 ? "text-warning" : "text-danger";
    return `<tr>
      <td class="font-mono small text-muted">#${r.id}</td>
      <td class="small text-nowrap">${r.timestamp.slice(0,19).replace("T"," ")}</td>
      <td class="small">${inp.gender||"—"}</td>
      <td class="small">${inp.applicant_income||"—"}</td>
      <td class="small">${inp.loan_amount||"—"}</td>
      <td class="text-center">${creditIcon}</td>
      <td class="text-center"><span class="badge ${badgeClass}">${r.result}</span></td>
      <td class="text-center small">${probPct}%</td>
      <td class="text-center small ${riskClass}">${r.risk_score}</td>
      <td class="text-center text-nowrap">
        <a href="result.html?id=${r.id}" class="btn btn-outline-primary btn-xs me-1" title="View"><i class="bi bi-eye"></i></a>
        <button class="btn btn-outline-secondary btn-xs me-1" onclick="dlPDF('${r.id}')" title="PDF"><i class="bi bi-file-earmark-pdf"></i></button>
        <button class="btn btn-outline-danger btn-xs" onclick="delRecord('${r.id}', this)" title="Delete"><i class="bi bi-trash"></i></button>
      </td>
    </tr>`;
  }).join("");
}

function setupSearch(records) {
  const controls = document.getElementById("controls");
  controls.innerHTML = `
    <input type="text" id="search" class="form-control form-control-sm" placeholder="Search..." style="width:200px" />
    <button class="btn btn-outline-danger btn-sm" onclick="clearAll()">
      <i class="bi bi-trash me-1"></i>Clear All
    </button>`;
  document.getElementById("search").addEventListener("input", function() {
    const term = this.value.toLowerCase();
    const filtered = term
      ? records.filter(r => JSON.stringify(r).toLowerCase().includes(term))
      : records;
    renderTable(filtered);
  });
}

async function dlPDF(pid) { API.downloadReport(pid); }

async function delRecord(pid, btn) {
  if (!confirm("Delete this record?")) return;
  try {
    await API.deleteRecord(pid);
    btn.closest("tr").remove();
    allRecords = allRecords.filter(r => r.id !== pid);
    document.getElementById("recordCount").textContent = `${allRecords.length} record${allRecords.length !== 1 ? "s" : ""} stored`;
    showToast("Record deleted");
  } catch (err) { showToast(err.message, true); }
}

async function clearAll() {
  if (!confirm("Clear all prediction history?")) return;
  try {
    await API.clearHistory();
    allRecords = [];
    renderTable([]);
    document.getElementById("tableCard").style.display = "none";
    document.getElementById("emptyState").classList.remove("d-none");
    document.getElementById("recordCount").textContent = "0 records stored";
    document.getElementById("controls").innerHTML = "";
    showToast("History cleared");
  } catch (err) { showToast(err.message, true); }
}

(async function init() {
  try {
    const data = await API.getHistory(1, 100);
    allRecords = data.records;
    document.getElementById("loadingState").classList.add("d-none");
    document.getElementById("mainContent").classList.remove("d-none");
    document.getElementById("recordCount").textContent = `${data.total} record${data.total !== 1 ? "s" : ""} stored`;

    if (!allRecords.length) {
      document.getElementById("emptyState").classList.remove("d-none");
    } else {
      document.getElementById("tableCard").style.display = "";
      renderTable(allRecords);
      setupSearch(allRecords);
    }
  } catch (err) {
    document.getElementById("loadingState").classList.add("d-none");
    document.getElementById("mainContent").classList.remove("d-none");
    document.getElementById("emptyState").classList.remove("d-none");
    document.getElementById("emptyState").innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
  }
})();
</script>
</body>
</html>
